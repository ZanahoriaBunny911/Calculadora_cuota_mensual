<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Styles/main.css">
    <script type="module" src="Scripts/main.js"></script>
    <title>Calculadora de Cuota Mensual</title>
</head>
<body>
    <h1>Calculadora de Cuota Mensual</h1>   
    <main>
        <section class="laInfo">
            <div>
                <table class="datos_entrada">
                    <caption>Datos de la Cuota</caption>  
                    <tr>
                        <td>Valor del préstamo</td>
                        <td>
                            <input type="text" inputmode="decimal" id="valorPrestamo" placeholder="$0" name="valorPrestamo">
                        </td>
                    </tr>   
                    <tr>
                        <td>Tasa de Interés (%)</td>
                        <td>
                            <input type="text" inputmode="decimal" id="tasaInteres" placeholder="0.1">
                        </td>
                    </tr>                     
                    <tr>
                        <td>Plazo (meses)</td>
                        <td>
                            <input type="text" inputmode="decimal" id="plazoMeses" placeholder="12">
                        </td>
                    </tr>
                    <tr>
                        <td>Nombre</td>
                        <td>
                            <input type="text" value="" id="nombre" placeholder="John Doe">
                        </td>
                    </tr>                                
                </table>
            </div>
            <div class="error" id="error"></div>
            <div>
                <textarea id="laRespuesta" readonly>Salida---</textarea>
            </div>
            <div>
                <button id="calcular">Calcular Cuota</button> 
                <button id="historial">Ver Historial</button>
                <div class="contenedor-reportes">  
                    <button id="reportes" type="button">Consultar Reportes</button>

                    <div id="panel_reportes" class="panel-oculto">
                        <button id="sumatoria" type="button">a) Sumatoria de Cuotas</button>
                        <button id="mayor300k" type="button">b) Cuotas > $300,000</button>
                        <button id="menor1anio" type="button">c) Cuotas < 1 año</button>
                        <button id="mayor5M" type="button">d) Prestamos > $5,000,000</button>
                        <button id="interesMenor2" type="button">e) Interés < 2%</button>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
